<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Штаб</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: #EEF0EA; color: #1A1D1C; font: 16px/1.4 system-ui, sans-serif; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0 0 16px; color: #4C5450; }
    a { display: inline-block; background: #14614F; color: #F8F9F5; padding: 12px 20px; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Штаб</h1>
    <p id="status">Открываем…</p>
    <a id="go" href="#" hidden>Открыть Штаб</a>
  </main>
  <script>
    // Адрес туннеля меняется при перезапуске компьютера, поэтому читаем его свежим, мимо кэша
    fetch("address.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => r.json())
      .then(({ url }) => {
        if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) throw new Error();
        // Передаём дальше приглашение и путь внутри Штаба, например #/invite/…
        const target = url + "/" + (/^#\/[a-z0-9/-]*$/i.test(location.hash) ? location.hash : "");
        document.getElementById("go").href = target;
        document.getElementById("go").hidden = false;
        location.replace(target);
      })
      .catch(() => {
        document.getElementById("status").textContent = "Штаб сейчас недоступен. Похоже, компьютер выключен или перезагружается.";
      });
  </script>
</body>
</html>
